name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please do not post passwords, tokens or private page content. Security problems go to SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Browser, Acard Local desktop app, Server, MCP / REST API, Install or docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (git rev-parse --short HEAD)
      placeholder: v0.2.0
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Bun 1.4.2, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server output, browser console errors or a screenshot.
      render: text
