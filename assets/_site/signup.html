<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.signup">Create account - Acard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preload" href="/fonts/pretendard-core.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/_site/styles.css">
<link rel="stylesheet" href="/_site/auth.css">
</head>
<body>
<main class="auth">
  <div class="auth-box">
    <a class="auth-logo" href="/"><svg class="wordmark" viewBox="-1.00 -15.63 171.36 109.63" role="img" aria-label="OpenNotion" focusable="false"><use href="/wordmark-symbol.svg#w"/></svg></a>
    <h1 data-i18n="auth.signup.title">Create your Acard account</h1>
    <p class="sub" data-i18n="auth.signup.sub">Sign up for Acard Cloud</p>
    <form class="auth-form" data-action="signup" novalidate>
      <a class="btn btn-google" href="/api/auth/google"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8Z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.2v2.8A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.2a11 11 0 0 0 0 9.9l3.6-2.8Z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.2 7.1l3.6 2.8C6.7 7.3 9.1 5.4 12 5.4Z"/></svg><span data-i18n="auth.google">Continue with Google</span></a>
      <div class="or" data-i18n="auth.or">or</div>
      <div class="field"><label for="email" data-i18n="auth.email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password" data-i18n="auth.pw8">Password (8+ characters)</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn btn-primary" type="submit" data-i18n="auth.signup.btn">Sign up with email</button>
      <div class="msg" role="status"></div>
      <p class="fine" data-i18n-html="auth.signup.fine">By signing up you agree to the <a href="/terms">Terms</a> and the <a href="/privacy">Privacy Policy</a>.</p>
    </form>
    <p class="switch"><span data-i18n="auth.haveAccount">Already have an account?</span> <a href="/login" data-i18n="auth.login.btn">Log in</a></p>
  </div>
  <p class="corner" data-i18n-html="auth.selfHost">To self-host, see <a href="https://github.com/" rel="noopener">GitHub</a></p>
<nav class="lang-switch" aria-label="Language" data-i18n-attr="aria-label:lang.label"><a href="?lang=en" data-lang="en" lang="en">EN</a><a href="?lang=ko" data-lang="ko" lang="ko">한국어</a><a href="?lang=zh" data-lang="zh" lang="zh-CN">中文</a></nav>
</main>
<script src="/_site/auth.js" defer></script>
</body>
</html>
